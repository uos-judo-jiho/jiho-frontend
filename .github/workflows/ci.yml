name: CI

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # pnpm --filter "...[<ref>]" 가 base 브랜치와 diff를 계산하려면 전체 히스토리가 필요하다.
          fetch-depth: 0

      - name: Fetch base branch
        run: git fetch --no-tags origin "${{ github.base_ref }}"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate API client (packages/api)
        run: pnpm orval
        env:
          NODE_ENV: production

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm type-check

      - name: Test
        run: pnpm test

      # 변경된 워크스페이스 프로젝트(및 그에 의존하는 프로젝트)만 빌드한다.
      # 루트 설정(lockfile, workspace, root package.json, 이 워크플로우)이 바뀐 경우에는
      # 영향 범위를 특정할 수 없으므로 전체를 빌드한다.
      - name: Build changed projects
        env:
          NODE_ENV: production
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          BASE="origin/${BASE_REF}"

          if git diff --name-only "${BASE}...HEAD" \
            | grep -qE '^(pnpm-lock\.yaml|pnpm-workspace\.yaml|package\.json|\.github/workflows/ci\.yml)$'; then
            echo "::notice::루트 설정이 변경되어 전체 프로젝트를 빌드합니다."
            pnpm -r --no-fail-if-no-match run --if-present build
          else
            echo "::notice::${BASE} 대비 변경된 프로젝트만 빌드합니다."
            pnpm --filter "...[${BASE}]" --no-fail-if-no-match run --if-present build
          fi
