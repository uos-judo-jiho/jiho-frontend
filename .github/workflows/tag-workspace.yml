name: Tag Workspace

# main 에 푸시될 때마다 워크스페이스 프로젝트(apps/* · packages/*)에 태그를 만든다.
#
#   스냅샷 태그  <name>@<version>-<YYYYMMDD>-<HHmm>   예) web@2.1.0-20260902-0346
#     코드가 바뀌면 항상. 버전이 안 올라가도 "이 커밋이 이 프로젝트의 이 시점"을
#     남긴다. 타임스탬프는 KST 이고 실행 시각이 아니라 커밋 시각에서 뽑으므로,
#     같은 커밋을 재실행해도 태그 이름이 같다 (멱등).
#
#   릴리즈 태그  <name>@<version>                      예) api@0.2.0
#     package.json 의 version 이 올라갈 때만.
#     여기서는 packages/* 만 만든다 — 앱의 릴리즈 태그는 release-note.yml 이
#     GitHub Release 와 함께 만든다.
#
# (배포 태그 @uos-judo-jiho/<app>-... 는 tag-release.yml 이 배포 성공 후 만든다)
#
# NOTE: 여기서 만든 태그는 GITHUB_TOKEN 으로 푸시되므로 다른 워크플로우를
#       트리거하지 않는다 (GitHub 의 재귀 방지 정책). 태그를 트리거로 삼는
#       publish 를 붙이려 하면 동작하지 않는다 — docs/packages-publishing.md 참고.

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      package:
        description: "릴리즈 태그를 백필할 패키지 (packages/ 하위 디렉토리명, 예: api). 비우면 전체"
        required: false
        type: string

# 태그 생성이 겹치지 않도록 직렬화한다.
concurrency:
  group: tag-workspace
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # 기존 태그와 대조하고 base..head 를 diff 해야 하므로 전체 히스토리가 필요하다.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Collect tags
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PACKAGE: ${{ inputs.package }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          # 스크립트는 GITHUB_OUTPUT 에도 쓰지만 여기서는 stdout 만 쓴다.
          # (두 번 호출하므로 스텝 출력이 덮어써진다 — 파일로 받는다)
          export GITHUB_OUTPUT=""

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            # 수동 실행은 패키지 릴리즈 태그 백필 전용이다.
            # 버전 비교 없이 현재 버전 그대로 뽑는다.
            ARGS=(detect --dir packages --all)
            if [ -n "${INPUT_PACKAGE:-}" ]; then
              ARGS+=(--project "$INPUT_PACKAGE")
            fi
            node scripts/release-note.mjs "${ARGS[@]}" > release.json
            echo "[]" > snapshot.json
          else
            node scripts/release-note.mjs snapshot --base "$BEFORE" > snapshot.json
            node scripts/release-note.mjs detect --dir packages --base "$BEFORE" > release.json
          fi

          node -e '
            const fs = require("node:fs");
            const read = (file) => JSON.parse(fs.readFileSync(file, "utf8"));
            const rows = [
              ...read("snapshot.json").map((r) => ({ ...r, kind: "snapshot" })),
              ...read("release.json").map((r) => ({ ...r, kind: "release" })),
            ];
            // 줄마다 개행으로 끝내야 한다 — 마지막 줄에 개행이 없으면
            // 아래 `while read` 가 그 줄을 통째로 버린다.
            const line = (r) => `${[r.tag, r.name, r.version, r.kind].join("\t")}\n`;
            fs.writeFileSync("tags.tsv", rows.map(line).join(""));
            console.log(`태그 후보 ${rows.length}개`);
          '

      - name: Create and push tags
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          SHORT_SHA="$(echo "$GITHUB_SHA" | cut -c1-7)"
          CREATED=()

          while IFS=$'\t' read -r TAG NAME VERSION KIND; do
            [ -n "$TAG" ] || continue

            # 같은 커밋을 재실행하면 스냅샷 태그 이름이 같으므로 여기서 걸린다.
            if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
              echo "::notice::${TAG} 태그가 이미 있어 건너뜁니다."
              continue
            fi

            if [ "$KIND" = "snapshot" ]; then
              MESSAGE="${NAME} ${VERSION} snapshot (${SHORT_SHA})"
            else
              MESSAGE="${NAME} v${VERSION}"
            fi

            git tag -a "$TAG" -m "$MESSAGE" "$GITHUB_SHA"
            CREATED+=("refs/tags/${TAG}")
            echo "- \`${TAG}\` — ${MESSAGE}" >> "$GITHUB_STEP_SUMMARY"
          done < tags.tsv

          if [ "${#CREATED[@]}" -eq 0 ]; then
            echo "::notice::새로 만들 태그가 없습니다."
            exit 0
          fi

          # 한 번에 밀어 태그마다 push 가 도는 것을 막는다.
          git push origin "${CREATED[@]}"
          echo "::notice::태그 ${#CREATED[@]}개를 생성했습니다."
