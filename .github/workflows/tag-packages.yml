name: Tag Packages

# packages/<pkg>/package.json 의 version 이 올라가면 `<pkg>@<version>` 태그를 만든다.
#   예) api@0.2.0, auth@0.3.1, jds@0.1.0
#
# 앱(apps/*)의 릴리즈 태그 + 릴리즈 노트는 release-note.yml 이 담당한다.
# 여기는 태그만 만든다 — 패키지는 아직 어디에도 배포하지 않으므로 릴리즈 노트를
# 붙일 대상이 없다. 배포(GitHub Packages)를 붙일 때의 설계는
# docs/packages-publishing.md 를 볼 것.
#
# NOTE: 여기서 만든 태그는 GITHUB_TOKEN 으로 푸시되므로 다른 워크플로우를
#       트리거하지 않는다 (GitHub 의 재귀 방지 정책). 나중에 태그를 트리거로
#       삼는 publish 워크플로우를 붙이려 하면 동작하지 않는다 — 같은 문서에
#       대안을 정리해 뒀다.

on:
  push:
    branches: ["main"]
    paths:
      - "packages/*/package.json"
  workflow_dispatch:
    inputs:
      package:
        description: "태그를 만들 패키지 (packages/ 하위 디렉토리명, 예: api). 비우면 전체"
        required: false
        type: string

# 태그 생성이 겹치지 않도록 직렬화한다.
concurrency:
  group: tag-packages
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # 기존 태그와 대조해야 하므로 전체 히스토리 + 태그가 필요하다.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Detect version bumps
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PACKAGE: ${{ inputs.package }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          # 스크립트가 releases / has_releases 를 GITHUB_OUTPUT 에 직접 기록한다.
          ARGS=(detect --dir packages)
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            # 수동 실행은 버전 비교 없이 현재 버전 그대로 태그를 만든다. (백필용)
            ARGS+=(--all)
            if [ -n "${INPUT_PACKAGE:-}" ]; then
              ARGS+=(--project "$INPUT_PACKAGE")
            fi
          else
            ARGS+=(--base "$BEFORE")
          fi

          node scripts/release-note.mjs "${ARGS[@]}"

      - name: Summarize
        if: ${{ steps.detect.outputs.has_releases != 'true' }}
        run: echo "::notice::버전이 올라간 패키지가 없어 태그 생성을 건너뜁니다."

      - name: Create and push tags
        if: ${{ steps.detect.outputs.has_releases == 'true' }}
        env:
          RELEASES: ${{ steps.detect.outputs.releases }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 태그 이름 / 패키지 이름 / 버전을 탭으로 구분해 한 줄씩 뽑는다.
          node -e '
            const releases = JSON.parse(process.env.RELEASES);
            const line = (r) => [r.tag, r.name, r.version].join("\t");
            process.stdout.write(releases.map(line).join("\n") + "\n");
          ' > /tmp/releases.tsv

          CREATED=0
          while IFS=$'\t' read -r TAG NAME VERSION; do
            [ -n "$TAG" ] || continue

            if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
              echo "::notice::${TAG} 태그가 이미 있어 건너뜁니다."
              continue
            fi

            git tag -a "$TAG" -m "${NAME} v${VERSION}" "$GITHUB_SHA"
            git push origin "refs/tags/${TAG}"

            echo "::notice::태그 생성: ${TAG} (${NAME} v${VERSION})"
            echo "- \`${TAG}\` — ${NAME} v${VERSION}" >> "$GITHUB_STEP_SUMMARY"
            CREATED=$((CREATED + 1))
          done < /tmp/releases.tsv

          if [ "$CREATED" -eq 0 ]; then
            echo "::notice::새로 만든 태그가 없습니다."
          fi
