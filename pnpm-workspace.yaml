packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  esbuild: true

# 두 곳 이상에서 쓰는 의존성, 그리고 버전을 맞춰 움직여야 하는 패밀리(@tanstack,
# tailwind, orval, vitest)는 여기서 한 번에 관리한다. 워크스페이스에서는 `catalog:` 로 참조한다.
catalog:
  # @types
  "@types/react": "^18.0.29"
  "@types/react-dom": "^18.0.11"
  "@types/node": "^26.6.3"

  "typescript": "^5.9.3"

  # react
  "react": "^18.2.0"
  "react-dom": "^18.2.0"

  # build tools
  "vite": "^8.3.1"
  "@vitejs/plugin-react": "^6.1.1"
  "tsdown": "^0.23.0"
  "tsx": "^4.23.15"

  # api client
  "axios": "^1.20.0"
  "orval": "^8.38.0"
  "@orval/core": "^8.38.0"

  # @tanstack
  "@tanstack/react-query": "^5.104.0"
  "@tanstack/react-query-devtools": "^5.104.0"
  "@tanstack/react-router": "^1.170.40"
  "@tanstack/react-router-ssr-query": "^1.167.3"
  "@tanstack/react-start": "^1.168.59"
  "@tanstack/router-plugin": "^1.168.41"

  # styling
  "tailwindcss": "^4.3.3"
  "@tailwindcss/vite": "^4.3.3"
  "@tailwindcss/postcss": "^4.3.3"
  "tailwind-merge": "^3.7.0"
  "tailwindcss-animate": "^1.0.7"
  "postcss": "^8.5.28"
  "clsx": "^2.1.1"
  "class-variance-authority": "^0.7.1"

  # ui
  "@radix-ui/react-slot": "^1.3.3"
  "lucide-react": "^1.48.0"
  "overlay-kit": "^1.9.0"
  "sonner": "^2.0.8"

  # markdown
  "react-markdown": "^10.1.0"
  "remark-breaks": "^4.0.0"
  "remark-gfm": "^4.0.1"

  # form
  "react-hook-form": "^7.89.0"
  "@hookform/resolvers": "^5.9.1"
  "zod": "^4.6.5"

  # routing (shorts, packages/auth)
  "react-router-dom": "^6.30.6"

  # test
  "vitest": "^5.0.2"
  "@vitest/ui": "^5.0.2"
